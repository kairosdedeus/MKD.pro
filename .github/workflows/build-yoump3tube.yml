name: Build YouMp3Tube

on:
  workflow_dispatch:
  push:
    tags:
      - "yoump3tube-v*"

permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            command: npm run dist:mac
          - name: Windows 10+
            os: windows-2022
            command: npm run dist:win

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: youtube-local-helper

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: youtube-local-helper/package-lock.json

      - run: npm ci
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: YouMp3Tube-${{ matrix.name }}
          path: |
            youtube-local-helper/dist/*.dmg
            youtube-local-helper/dist/*.zip
            youtube-local-helper/dist/*.exe
          if-no-files-found: error

      - name: Publicar instaladores no GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            youtube-local-helper/dist/*.dmg
            youtube-local-helper/dist/*.zip
            youtube-local-helper/dist/*.exe

  android:
    name: Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mkd-audio-android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: android-actions/setup-android@v3

      - run: ./gradlew assembleDebug
      - run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/YouMp3Tube.apk

      - uses: actions/upload-artifact@v4
        with:
          name: YouMp3Tube-Android
          path: mkd-audio-android/dist/YouMp3Tube.apk
          if-no-files-found: error

      - name: Publicar APK no GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mkd-audio-android/dist/YouMp3Tube.apk
